name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend directory
        id: detect
        run: |
          if [ -f ./package.json ]; then echo "FRONTEND_DIR=." >> $GITHUB_ENV;
          elif [ -f codes/frontend/package.json ]; then echo "FRONTEND_DIR=codes/frontend" >> $GITHUB_ENV;
          else
            echo "No frontend package.json found at ./package.json or codes/frontend/package.json";
            exit 1;
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Sanity: list frontend files
        run: |
          echo "Using frontend dir=${{ env.FRONTEND_DIR }}"
          ls -la ${{ env.FRONTEND_DIR }}

      - name: Install dependencies
        run: cd ${{ env.FRONTEND_DIR }} && npm ci

      - name: Lint
        run: cd ${{ env.FRONTEND_DIR }} && npm run lint

      - name: Build
        run: cd ${{ env.FRONTEND_DIR }} && npm run build
